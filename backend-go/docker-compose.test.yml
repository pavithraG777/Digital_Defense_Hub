version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ddh
      POSTGRES_PASSWORD: ddh
      POSTGRES_DB: ddh_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddh -d ddh_test"]
      interval: 5s
      timeout: 2s
      retries: 10
    volumes:
      - db_test_data:/var/lib/postgresql/data

volumes:
  db_test_data:
