name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend-go/**'
      - 'scripts/migrations/**'
      - '.github/workflows/integration-tests.yml'
  push:
    branches: [ main, master ]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ddh
          POSTGRES_PASSWORD: ddh
          POSTGRES_DB: ddh_test
        options: >-
          --health-cmd="pg_isready -U ddh -d ddh_test"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U ddh -d ddh_test && break || sleep 1
          done

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://ddh:ddh@localhost:5432/ddh_test?sslmode=disable
        run: |
          cd backend-go
          go test ./integration -v
